name: "Build and Push Kubernetes DevContainer"

on:
  push:
    branches:
      - main
    paths:
      - 'src/kubernetes/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write # Required to create Git tags
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to calculate SemVer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "kubernetes-"

      - name: Determine Image Tags
        id: meta
        run: |
          VERSION="${{ steps.tag_version.outputs.new_version }}"
          if [ -z "$VERSION" ]; then
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # Step 1: Build & push the Docker image directly (ignores devcontainer.json placeholders)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/kubernetes
          file: ./src/kubernetes/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devcontainers/kubernetes:latest
            ghcr.io/${{ github.repository_owner }}/devcontainers/kubernetes:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 2: Publish the Dev Container template metadata files
      - name: Publish Dev Container Templates
        uses: devcontainers/action@v1
        with:
          publish-templates: "true"
          base-path-to-templates: "./src"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}